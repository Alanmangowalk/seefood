<!DOCTYPE html>
<html lang="zh-TW"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>SEEFOOD 戰情室 2.0</title>
<script src="https://cdn.tailwindcss.com"></script><script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
:root{--navy:#0B2239;--yellow:#F4B41A;--green:#20A36A;--bg:#F3F6F8;--line:#DDE4EA}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#071522;color:var(--navy)}button,input{font:inherit}
.shell{max-width:1180px;margin:auto;min-height:100dvh;background:#fff}.top{height:68px;padding:0 18px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #edf0f2;background:#fff;position:sticky;top:0;z-index:40}
.kicker{font-size:9px;font-weight:900;letter-spacing:.18em;color:#16825A}.title{font-size:22px;font-weight:950}.close{width:40px;height:40px;border:0;border-radius:13px;background:#F0F3F5;color:var(--navy);display:grid;place-items:center}
.toolbar{padding:14px 16px;border-bottom:1px solid #edf0f2}.searchwrap{position:relative}.search{width:100%;height:46px;border:1px solid #DDE4EA;background:#F7F9FA;border-radius:15px;padding:0 46px 0 42px;font-size:13px;outline:0}.search:focus{border-color:#B8C4CE;background:#fff}.searchicon{position:absolute;left:14px;top:14px;color:#6F7C88}.clear{position:absolute;right:10px;top:8px;width:30px;height:30px;border:0;border-radius:9px;background:#E9EEF2;color:#63717E}
.search-results{position:absolute;left:0;right:0;top:52px;background:#fff;border:1px solid #DDE4EA;border-radius:16px;box-shadow:0 18px 45px rgba(11,34,57,.14);z-index:100;max-height:52vh;overflow:auto;padding:6px}.search-results.hidden{display:none}.result{width:100%;text-align:left;border:0;background:#fff;padding:11px;border-radius:12px;display:flex;justify-content:space-between;gap:10px}.result:hover{background:#F6F8FA}.result b,.result span{display:block}.result b{font-size:12px}.result span{font-size:9px;color:#7C8793;margin-top:3px}.result .tag{font-size:8px;font-weight:900;white-space:nowrap;padding:5px 7px;border-radius:999px;background:#EEF2F5;color:#566575;height:max-content}.result.external .tag{background:#FFF3C8;color:#805A00}
.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:12px 16px}.metric{background:#F5F7F9;border-radius:15px;padding:12px}.metric:first-child{background:var(--navy);color:#fff}.metric small{font-size:8px;color:#87929E}.metric:first-child small{color:#9DB0C1}.metric b{display:block;font-size:22px;margin-top:2px}.metric .green{color:var(--green)}
.main{display:grid;grid-template-columns:330px minmax(0,1fr);min-height:calc(100dvh - 180px)}.side{border-right:1px solid #edf0f2;padding:14px;overflow:auto}.mapwrap{position:relative}.map{height:calc(100dvh - 180px);min-height:560px}.section-head{display:flex;justify-content:space-between;align-items:end;margin-bottom:10px}.section-head h2{font-size:17px;margin:0}.section-head p{font-size:9px;color:#8A96A3;margin:3px 0 0}.district{width:100%;border:1px solid #E0E6EB;background:#fff;border-radius:15px;padding:12px;text-align:left;margin-bottom:8px}.district b{font-size:12px}.district p{font-size:9px;color:#7B8792;margin:4px 0 0}.district .right{float:right;font-size:8px;font-weight:900;border-radius:999px;padding:4px 7px;background:#ECF8F3;color:#187A55}
.shop-marker{position:relative;width:30px;height:30px;border-radius:50%;border:3px solid #fff;box-shadow:0 5px 16px rgba(7,21,34,.28);display:grid;place-items:center;color:#fff;font-size:10px;font-weight:950}.shop-marker.active{background:#20A36A}.shop-marker.idle{background:#17344F}.shop-marker.hot{box-shadow:0 0 0 6px rgba(244,180,26,.18),0 5px 16px rgba(7,21,34,.28)}.knock-badge{position:absolute;right:-10px;top:-10px;min-width:18px;height:18px;border-radius:999px;background:#F4B41A;color:#0B2239;border:2px solid #fff;display:grid;place-items:center;font-size:8px;font-weight:950;padding:0 4px}
.locate{position:absolute;right:14px;bottom:18px;z-index:500;width:44px;height:44px;border:0;border-radius:14px;background:#fff;box-shadow:0 8px 22px rgba(7,21,34,.18);color:var(--navy);display:grid;place-items:center}
.drawer-bg{position:fixed;inset:0;background:rgba(4,15,24,.28);z-index:900}.drawer-bg.hidden{display:none}.drawer{position:absolute;right:20px;bottom:20px;width:min(420px,calc(100% - 40px));background:#fff;border-radius:24px;padding:18px;box-shadow:0 22px 65px rgba(4,15,24,.26)}.drawer h3{font-size:21px;margin:6px 0 0}.status-row{display:flex;gap:6px;flex-wrap:wrap}.pill{font-size:8px;font-weight:900;padding:5px 7px;border-radius:999px;background:#EEF2F5;color:#60707E}.pill.live{background:#E9F8F1;color:#16764F}.pill.plus{background:#FFF2C6;color:#795500}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}.stat{background:#F6F8FA;border-radius:13px;padding:10px}.stat small{font-size:8px;color:#7D8994}.stat b{display:block;font-size:17px;margin-top:2px}.demand{margin-top:12px;background:#FFF8DF;border:1px solid #F0DA95;border-radius:14px;padding:12px}.demand b{font-size:13px}.demand p{font-size:9px;color:#7D6B38;margin:4px 0 0}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.btn{border:0;border-radius:12px;padding:12px;font-size:11px;font-weight:950}.primary{background:var(--yellow);color:var(--navy)}.secondary{background:var(--navy);color:#fff}.ghost{background:#F0F3F5;color:var(--navy)}.watchline{display:flex;align-items:center;justify-content:space-between;gap:10px;border:1px solid #E1E6EA;border-radius:13px;padding:10px 12px;margin-top:9px}.watchline b,.watchline span{display:block}.watchline b{font-size:11px}.watchline span{font-size:8px;color:#7B8792;margin-top:2px}.switch{width:42px;height:25px;border-radius:999px;background:#D6DDE3;border:0;position:relative}.switch:after{content:"";width:19px;height:19px;background:#fff;border-radius:50%;position:absolute;left:3px;top:3px;transition:.2s;box-shadow:0 1px 4px rgba(0,0,0,.18)}.switch.on{background:#20A36A}.switch.on:after{left:20px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:1500;background:#0B2239;color:#fff;border-radius:12px;padding:11px 14px;font-size:11px;font-weight:850;box-shadow:0 12px 28px rgba(0,0,0,.22)}.toast.hidden{display:none}
@media(max-width:800px){.summary{grid-template-columns:repeat(2,1fr)}.main{display:block}.side{display:none}.map{height:calc(100dvh - 230px);min-height:480px}.drawer{right:0;bottom:0;width:100%;border-radius:24px 24px 0 0}.top{height:62px}.main{min-height:0}}
</style></head>
<body><div class="shell">
<header class="top"><div><div class="kicker">LIVE DEMAND × SUPPLY</div><div class="title">獵場戰情室 2.0</div></div><a href="index.html#home" class="close"><i data-lucide="x"></i></a></header>
<section class="toolbar"><div class="searchwrap"><i data-lucide="search" class="searchicon" width="18"></i><input id="place-search" class="search" placeholder="搜尋 SEEFOOD 獵場、店家或 Google 地點" autocomplete="off"><button class="clear" onclick="clearSearch()"><i data-lucide="x" width="15"></i></button><div id="search-results" class="search-results hidden"></div></div></section>
<section class="summary"><div class="metric"><small>在線獵場</small><b id="m-active">0</b></div><div class="metric"><small>已進駐</small><b id="m-total">0</b></div><div class="metric"><small>今日敲碗</small><b id="m-knocks" class="green">0</b></div><div class="metric"><small>在線獵物</small><b id="m-items">0</b></div></section>
<div class="main"><aside class="side"><div class="section-head"><div><h2>需求熱區</h2><p>在線供給與今日敲碗一起看</p></div></div><div id="district-list"></div></aside><section class="mapwrap"><div id="map" class="map"></div><button class="locate" onclick="locateMe()"><i data-lucide="locate-fixed" width="19"></i></button></section></div>
</div>
<div id="drawer-bg" class="drawer-bg hidden" onclick="if(event.target===this)closeDrawer()"><div class="drawer"><div style="display:flex;justify-content:space-between;gap:12px"><div><div id="d-pills" class="status-row"></div><h3 id="d-name">獵場</h3><p id="d-area" style="font-size:10px;color:#7D8994;margin:4px 0 0"></p></div><button class="close" onclick="closeDrawer()"><i data-lucide="x"></i></button></div><div class="stats"><div class="stat"><small>目前獵物</small><b id="d-items">0</b></div><div class="stat"><small>剩餘份數</small><b id="d-remain">0</b></div><div class="stat"><small>今日敲碗</small><b id="d-knock">0</b></div></div><div id="d-demand" class="demand"></div><div id="d-watch" class="watchline"><div><b>上架叫我</b><span>這家店一開賣，就通知你。</span></div><button id="d-watch-btn" class="switch" onclick="toggleWatch()"></button></div><div id="d-actions" class="actions"></div></div></div>
<div id="toast" class="toast hidden"></div>
<script>
const GAS="https://script.google.com/macros/s/AKfycbxOsS40qejUGDKjp0kQFn76CeM0DBiTN41HHorYJ6gBa9qK1fTEP3xDRbn7CgXo3C4Z9g/exec";
const uid=localStorage.getItem('seefood_line_uid')||'LINE_GUEST';
let payload={stores:[],allMerchants:[]},map,markers={},selected=null,userPos=null,userMarker=null,searchTimer=null;
const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(action,data={}){const p=new URLSearchParams({action,...data});const r=await fetch(GAS,{method:'POST',body:p});return r.json()}
function icons(){try{lucide.createIcons()}catch(e){}}
function toast(t){const x=document.getElementById('toast');x.textContent=t;x.classList.remove('hidden');setTimeout(()=>x.classList.add('hidden'),2400)}
function isActiveShop(id){return payload.stores.some(s=>String(s.shopId)===String(id)&&Number(s.remain)>0)}
function shopRemain(id){return payload.stores.filter(s=>String(s.shopId)===String(id)).reduce((a,b)=>a+(Number(b.remain)||0),0)}
function shopItems(id){return payload.stores.filter(s=>String(s.shopId)===String(id)&&Number(s.remain)>0).length}
async function load(){try{const r=await fetch(GAS+'?t='+Date.now()),j=await r.json();payload=j;renderSummary();renderDistricts();buildMap();const q=new URLSearchParams(location.search).get('shopId');if(q){const m=(payload.allMerchants||[]).find(x=>String(x.shopId)===q);if(m)setTimeout(()=>showMerchant(m),300)}}catch(e){toast('戰情資料連線失敗')}icons()}
function renderSummary(){const ms=payload.allMerchants||[],active=new Set((payload.stores||[]).filter(s=>Number(s.remain)>0).map(s=>s.shopId));document.getElementById('m-active').textContent=active.size;document.getElementById('m-total').textContent=payload.registeredStores||ms.length;document.getElementById('m-items').textContent=(payload.stores||[]).filter(s=>Number(s.remain)>0).length;document.getElementById('m-knocks').textContent=ms.reduce((a,m)=>a+(Number(m.knockToday)||0),0)}
function renderDistricts(){const d={};(payload.allMerchants||[]).forEach(m=>{const k=(m.city||'其他')+' '+(m.district||'');d[k]??={city:m.city,district:m.district,total:0,active:0,knocks:0};d[k].total++;d[k].knocks+=Number(m.knockToday)||0;if(isActiveShop(m.shopId))d[k].active++});const arr=Object.values(d).sort((a,b)=>b.knocks-a.knocks||b.active-a.active||b.total-a.total);document.getElementById('district-list').innerHTML=arr.map(x=>`<button class="district" onclick="focusDistrict('${esc(x.city)}','${esc(x.district)}')"><span class="right">${x.knocks?x.knocks+' 人敲碗':x.active+' 家在線'}</span><b>${esc(x.city)} ${esc(x.district)}</b><p>${x.total} 家進駐 · ${x.active} 家在線</p></button>`).join('')||'<p style="font-size:11px;color:#8A96A3">目前尚無獵場資料</p>'}
function buildMap(){map=L.map('map',{zoomControl:true}).setView([23.7,121],7);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap'}).addTo(map);(payload.allMerchants||[]).forEach(m=>{if(!m.lat||!m.lng)return;addMerchantMarker(m)})}
function addMerchantMarker(m){const active=isActiveShop(m.shopId),k=Number(m.knockToday)||0,hot=k>=3;const icon=L.divIcon({className:'',html:`<div class="shop-marker ${active?'active':'idle'} ${hot?'hot':''}"><i data-lucide="${active?'utensils':'bell-ring'}" style="width:13px"></i>${k?`<span class="knock-badge">${k}</span>`:''}</div>`,iconSize:[30,30],iconAnchor:[15,15]});const mk=L.marker([m.lat,m.lng],{icon}).addTo(map).on('click',()=>showMerchant(m));markers[m.shopId]=mk;icons()}
function focusDistrict(city,district){const xs=(payload.allMerchants||[]).filter(m=>m.city===city&&m.district===district&&markers[m.shopId]).map(m=>markers[m.shopId]);if(xs.length)map.fitBounds(L.featureGroup(xs).getBounds().pad(.35))}
function locateMe(){navigator.geolocation?.getCurrentPosition(p=>{userPos=[p.coords.latitude,p.coords.longitude];if(userMarker)userMarker.remove();userMarker=L.circleMarker(userPos,{radius:7,color:'#2563EB',weight:3,fillColor:'#60A5FA',fillOpacity:.9}).addTo(map).bindTooltip('你在這裡');map.setView(userPos,15)},()=>toast('請允許定位後再試一次'),{enableHighAccuracy:true,maximumAge:30000,timeout:8000})}
function showMerchant(m){selected={type:'merchant',...m,watching:false};const active=isActiveShop(m.shopId),items=shopItems(m.shopId),remain=shopRemain(m.shopId),k=Number(m.knockToday)||0;document.getElementById('d-name').textContent=m.name||'獵場';document.getElementById('d-area').textContent=[m.city,m.district,m.address].filter(Boolean).join(' · ');document.getElementById('d-items').textContent=items;document.getElementById('d-remain').textContent=remain;document.getElementById('d-knock').textContent=k;document.getElementById('d-pills').innerHTML=`<span class="pill ${active?'live':''}">${active?'正在開賣':'暫無獵物'}</span>${m.isVip?'<span class="pill plus">Plus</span>':''}<span class="pill">${m.verified?'已實名':'驗證中'}</span>`;document.getElementById('d-demand').innerHTML=active?`<b>獵場目前有 ${items} 個獵物</b><p>直接查看商品，或分享給附近的朋友一起搶。</p>`:`<b>今天已有 ${k} 位獵人在敲碗</b><p>敲一下碗，讓老闆知道現在有人想吃；也可以開啟上架通知。</p>`;document.getElementById('d-actions').innerHTML=active?`<button class="btn ghost" onclick="focusSelected()">地圖查看</button><button class="btn primary" onclick="goHunt('${esc(m.shopId)}')">查看獵物</button>`:`<button class="btn ghost" onclick="focusSelected()">地圖查看</button><button class="btn primary" onclick="knock()">敲一下碗</button>`;document.getElementById('d-watch').style.display=active?'none':'flex';document.getElementById('d-watch-btn').classList.remove('on');document.getElementById('drawer-bg').classList.remove('hidden');icons()}
function closeDrawer(){document.getElementById('drawer-bg').classList.add('hidden')}
function focusSelected(){if(selected?.lat&&selected?.lng){map.setView([selected.lat,selected.lng],16);closeDrawer()}}
function goHunt(id){location.href=`index.html?targetShopId=${encodeURIComponent(id)}#home`}
async function knock(){if(uid==='LINE_GUEST'){toast('請先回首頁登入 LINE');return}const j=await api('knockShop',{uid,shopId:selected.shopId,subscribe:document.getElementById('d-watch-btn').classList.contains('on')?'1':'0'});if(j.status==='success'){selected.knockToday=j.knockToday;const m=(payload.allMerchants||[]).find(x=>x.shopId===selected.shopId);if(m)m.knockToday=j.knockToday;document.getElementById('d-knock').textContent=j.knockToday;document.getElementById('d-demand').innerHTML=`<b>今天已有 ${j.knockToday} 位獵人在敲碗</b><p>${j.alreadyKnocked?'你今天已經敲過這家，我們保留一次需求紀錄。':'老闆的 SEEFOOD 帳號會看到通知；達提醒門檻時也會收到 Email。'}</p>`;renderSummary();renderDistricts();toast(j.alreadyKnocked?'今天已敲過這家':'敲碗成功，老闆收到啦');refreshMarker(selected.shopId)}else toast(j.msg||'敲碗失敗')}
async function toggleWatch(){if(uid==='LINE_GUEST'){toast('請先回首頁登入 LINE');return}const b=document.getElementById('d-watch-btn'),next=!b.classList.contains('on'),j=await api('setShopWatch',{uid,shopId:selected.shopId,active:next?'1':'0'});if(j.status==='success'){b.classList.toggle('on',next);toast(next?'已開啟：上架叫我':'已取消上架通知')}else toast(j.msg||'設定失敗')}
function refreshMarker(id){const m=(payload.allMerchants||[]).find(x=>x.shopId===id);if(!m||!markers[id])return;markers[id].remove();delete markers[id];addMerchantMarker(m)}
function clearSearch(){document.getElementById('place-search').value='';document.getElementById('search-results').classList.add('hidden')}
function localMatches(q){q=q.toLowerCase();return (payload.allMerchants||[]).filter(m=>(m.name+' '+m.address).toLowerCase().includes(q)).slice(0,6)}
async function doSearch(q){const box=document.getElementById('search-results');if(q.trim().length<2){box.classList.add('hidden');return}box.classList.remove('hidden');box.innerHTML='<div style="padding:12px;font-size:10px;color:#7B8792">搜尋中…</div>';const local=localMatches(q);let external=[];try{const j=await api('searchPlaceCandidates',{q,lat:userPos?.[0]||'',lng:userPos?.[1]||''});if(j.status==='success')external=j.places||[];else if(j.status==='config_required')external=[]}catch(e){}const localIds=new Set(local.map(m=>String(m.name)+'|'+String(m.address)));const rows=[];local.forEach(m=>rows.push(`<button class="result" onclick="selectLocal('${esc(m.shopId)}')"><div><b>${esc(m.name)}</b><span>${esc(m.address||[m.city,m.district].filter(Boolean).join(' '))}</span></div><span class="tag">${isActiveShop(m.shopId)?'SEEFOOD · 開賣中':'SEEFOOD · 可敲碗'}</span></button>`));external.filter(p=>!localIds.has(String(p.name)+'|'+String(p.address))).forEach((p,i)=>rows.push(`<button class="result external" onclick='recommendExternal(${JSON.stringify(p).replace(/'/g,"&#39;")})'><div><b>${esc(p.name)}</b><span>${esc(p.address)}</span></div><span class="tag">推薦新獵場</span></button>`));box.innerHTML=rows.join('')||'<div style="padding:12px;font-size:10px;color:#7B8792">找不到結果。若 Google Places 尚未設定，請先由總部完成 API 設定。</div>';icons()}
function selectLocal(id){clearSearch();const m=(payload.allMerchants||[]).find(x=>String(x.shopId)===String(id));if(m){showMerchant(m);if(m.lat&&m.lng)map.setView([m.lat,m.lng],16)}}
async function recommendExternal(p){if(uid==='LINE_GUEST'){toast('請先回首頁登入 LINE');return}const j=await api('recommendPlace',{uid,googlePlaceId:p.googlePlaceId,name:p.name,address:p.address,lat:p.lat,lng:p.lng,city:p.city||'',district:p.district||''});if(j.status==='success'){toast(j.alreadyRecommended?'你已推薦過這家':'推薦成功，情報已交給 SEEFOOD');document.getElementById('search-results').classList.add('hidden')}else toast(j.msg||'推薦失敗')}
document.getElementById('place-search').addEventListener('input',e=>{clearTimeout(searchTimer);const q=e.target.value;searchTimer=setTimeout(()=>doSearch(q),380)});
load();icons();
</script></body></html>
