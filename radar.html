<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="google" content="notranslate">
    <title>SEEFOOD 惜福聯盟 - 全台點燈戰情室</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { theme: { extend: { colors: { radarGreen: '#10b981', seefoodYellow: '#FAB900', tacticalOrange: '#f97316' } } } }
    </script>
    <style>
        body { background-color: #020617; background-image: linear-gradient(rgba(16,185,129,0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(16,185,129,0.03) 1px, transparent 1px); background-size: 25px 25px; color: #e2e8f0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; position: relative; }
        body::before { content: ""; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.1) 50%); background-size: 100% 4px; z-index: 100; pointer-events: none; opacity: 0.5; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .ticker { display: inline-block; white-space: nowrap; padding-left: 100vw; animation: ticker 40s linear infinite; }
        @keyframes ticker { 0% { transform: translate3d(0, 0, 0); } 100% { transform: translate3d(-100%, 0, 0); } }
        .glow-text-green { text-shadow: 0 0 10px rgba(16,185,129,0.7); }
        .glow-text-yellow { text-shadow: 0 0 10px rgba(250,185,0,0.5); }
        .dark-map-tiles { filter: invert(100%) hue-rotate(180deg) brightness(90%) contrast(95%); }
        .leaflet-container { background: #000 !important; font-family: inherit; }
        @keyframes sonar-ripple { 0% { transform: scale(0.1); opacity: 0.8; } 100% { transform: scale(2.5); opacity: 0; } }
        .sonar-marker { background: #10b981; border-radius: 50%; position: relative; width: 10px; height: 10px; box-shadow: 0 0 10px #10b981; }
        .sonar-marker::after { content: ""; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #10b981; border-radius: 50%; animation: sonar-ripple 2s ease-out infinite; }
        
        .standby-marker { background: #facc15; border-radius: 50%; position: relative; width: 8px; height: 8px; box-shadow: 0 0 8px rgba(250,204,21,0.6); opacity: 0.9; }

        .leaflet-popup-content-wrapper { background-color: #0f172a; color: #e2e8f0; border: 1px solid #10b981; border-radius: 12px; font-family: inherit; box-shadow: 0 0 15px rgba(16,185,129,0.3); }
        .leaflet-popup-tip { background-color: #0f172a; border: 1px solid #10b981; }
        .leaflet-popup-close-button { display: none !important; }
        .leaflet-popup-content { margin: 12px; }
        .tactical-card { position: relative; border: 1px solid #1e293b; background-color: rgba(15, 23, 42, 0.5); backdrop-blur-sm; cursor: pointer; transition: all 0.2s ease-out; }
        .tactical-card:hover { border-color: #10b981; transform: scale(1.02); background-color: rgba(15, 23, 42, 0.8); }
        .tactical-card::before, .tactical-card::after { content: ""; position: absolute; width: 10px; height: 10px; border-color: #10b981; border-style: solid; opacity: 0.5; }
        .tactical-card::before { top: -1px; left: -1px; border-width: 2px 0 0 2px; } 
        .tactical-card::after { bottom: -1px; right: -1px; border-width: 0 2px 2px 0; } 
        .hunting-zone { border-color: #ef4444 !important; box-shadow: 0 0 20px rgba(239,68,68,0.2); }
        .hunting-zone::before, .hunting-zone::after { border-color: #ef4444; opacity: 1; }
    </style>
</head>
<body class="h-[100dvh] flex flex-col overflow-hidden">

    <header class="p-5 text-center relative z-10 border-b border-slate-800 bg-slate-950/60 backdrop-blur-sm flex-none">
        <div class="inline-block border-l-4 border-r-4 border-seefoodYellow px-4">
            <h1 class="text-2xl font-black text-seefoodYellow tracking-widest glow-text-yellow mb-0.5">全台點燈戰情室</h1>
            <p class="text-[10px] text-radarGreen font-mono animate-pulse tracking-tight">>> SECTOR STATUS: SCANNING // 獵場即時監控</p>
        </div>
    </header>

    <div class="px-4 w-full max-w-lg mx-auto relative z-10 my-3 flex-none">
        <div class="border border-radarGreen/40 rounded-xl overflow-hidden shadow-[0_0_30px_rgba(16,185,129,0.15)] relative p-1 bg-slate-900">
            <div id="radar-map" class="h-56 w-full rounded-lg relative z-0"></div>
            
            <!-- 🎯 新增的 GPS 狙擊定位按鈕 -->
            <button onclick="zoomToUserLocation()" class="absolute bottom-10 right-2 bg-slate-900/90 border border-lime-500/50 hover:border-lime-400 text-lime-400 p-2.5 rounded-xl shadow-[0_0_15px_rgba(132,204,22,0.4)] active:scale-95 transition z-[400] flex items-center justify-center">
                🎯 <span id="gps-text" class="text-[9px] font-mono ml-1 font-black tracking-widest">MY GPS</span>
            </button>

            <div class="absolute top-2 right-2 bg-black/70 text-radarGreen text-[9px] font-mono px-2 py-0.5 rounded-sm border border-radarGreen/30 z-[400] pointer-events-none animate-pulse">
                RECEIVING L-UID GPS...
            </div>
            <div class="absolute bottom-2 left-2 bg-black/70 text-gray-300 text-[9px] px-2.5 py-1 rounded-sm z-[400] pointer-events-none font-bold tracking-wide flex space-x-2">
                <span>🟢 上線營業中</span>
                <span class="text-yellow-400">🟡 未上架整備中</span>
            </div>
        </div>
    </div>

    <div class="w-full bg-slate-900/90 border-y border-slate-700 flex items-center shadow-[inset_0_0_15px_rgba(0,0,0,0.5)] relative z-10 box-border flex-none">
        <div class="flex-none bg-slate-900 text-radarGreen text-xs font-black px-3 py-2.5 z-20 relative border-r border-slate-700 shadow-[5px_0_10px_rgba(15,23,42,0.8)]">
            📡 LATEST_NEWS:
        </div>
        <div class="flex-1 overflow-hidden relative py-2.5">
            <div id="news-ticker" class="ticker text-xs font-bold text-gray-300">
                ⏳ 正在接入 GAS 雲端大腦，解析全台雷達數據...
            </div>
        </div>
    </div>

    <main class="flex-1 px-4 space-y-4 max-w-lg mx-auto w-full z-10 overflow-y-auto pt-4 pb-28 no-scrollbar" id="district-container" style="-webkit-overflow-scrolling: touch;">
        <div class="text-center py-12 skeleton"><span class="text-5xl animate-spin inline-block mb-4 opacity-70">📡</span><p class="text-radarGreen font-mono text-sm">雷達座標解碼中...</p></div>
    </main>

    <div class="fixed bottom-0 left-0 w-full bg-slate-950/90 backdrop-blur-lg border-t border-slate-700 p-4 z-50 flex space-x-2.5 pb-7 shadow-[0_-10px_30px_rgba(0,0,0,0.5)] justify-center">
        <div class="w-full max-w-lg flex space-x-2.5">
            <button onclick="joinNow()" class="w-1/2 bg-seefoodYellow text-slate-900 font-black py-4 rounded-xl shadow-lg active:scale-95 transition text-sm flex flex-col items-center leading-none justify-center border border-seefoodYellow/50">
                <span class="text-base">🤝 我要入場卡位</span>
                <span class="text-[10px] mt-1.5 opacity-90 font-bold">單店即發車 0月費0抽成</span>
            </button>
            <button onclick="shareToPeers()" class="w-1/2 bg-gradient-to-br from-slate-800 to-slate-900 text-white font-bold py-4 rounded-xl shadow-lg active:scale-95 transition text-sm flex flex-col items-center leading-none justify-center border border-slate-700">
                <span class="text-base text-emerald-400">📢 號召獵人點燈</span>
                <span class="text-[10px] mt-1.5 opacity-80 text-gray-400">招募同業 享全區流量</span>
            </button>
        </div>
    </div>

    <script>
        const gasUrl = "https://script.google.com/macros/s/AKfycbxOsS40qejUGDKjp0kQFn76CeM0DBiTN41HHorYJ6gBa9qK1fTEP3xDRbn7CgXo3C4Z9g/exec";
        let map; let districtDataMap = {};

        window.addEventListener('DOMContentLoaded', async () => {
            initMap(); 
            try {
                const res = await fetch(gasUrl + "?t=" + new Date().getTime());
                const data = await res.json();
                processRadarData(data.allMerchants || [], data.stores || []);
            } catch (err) {
                document.getElementById('news-ticker').innerText = "⚠️ 系統連線異常，請稍後再試...";
                document.getElementById('district-container').innerHTML = '<div class="text-center text-red-500 py-10">資料庫讀取失敗</div>';
            }
        });

        function initMap() {
            map = L.map('radar-map', { zoomControl: false, attributionControl: false }).setView([24.1477, 120.6431], 12);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { className: 'dark-map-tiles', maxZoom: 19 }).addTo(map);
        }

        // 🎯 執行定位並飛入地圖中心
        function zoomToUserLocation() {
            if (!navigator.geolocation) {
                alert("🛡️ 阻斷：您的瀏覽器拒絕提供安全定位權限！");
                return;
            }
            
            const btnText = document.getElementById('gps-text');
            const originalText = btnText.innerText;
            btnText.innerText = "LOCATING...";
            
            navigator.geolocation.getCurrentPosition(
                (position) => {
                    const lat = position.coords.latitude;
                    const lng = position.coords.longitude;
                    
                    if (typeof map !== 'undefined' && map !== null) {
                        map.flyTo([lat, lng], 15, { animate: true, duration: 1.5 });
                        // 加上一個綠色光圈代表獵人目前位置
                        L.circle([lat, lng], { radius: 150, color: '#10b981', fillColor: '#10b981', fillOpacity: 0.2 }).addTo(map);
                    }
                    
                    btnText.innerText = originalText;
                },
                (error) => {
                    btnText.innerText = originalText;
                    alert("📍 提示：請開啟手機 GPS 定位功能，才能順利跳轉座標喔！");
                },
                { enableHighAccuracy: true, timeout: 7000 }
            );
        }

        function processRadarData(allMerchants, activeStores) {
            let uniqueShops = {};
            let activeShopIds = new Set();
            activeStores.forEach(s => activeShopIds.add(s.shopId));
            
            let tickerMsgs = []; let allMarkers = []; districtDataMap = {};
            allMerchants.forEach(s => { if (!uniqueShops[s.shopId]) { uniqueShops[s.shopId] = s; } });

            Object.values(uniqueShops).forEach(s => {
                let cityClean = s.city ? s.city.replace(/臺/g, "台") : "全部地區";
                let districtClean = s.district || "全部行政區";
                let dKey = `${cityClean}_${districtClean}`;
                
                if (!districtDataMap[dKey]) { 
                    districtDataMap[dKey] = { city: cityClean, district: districtClean, total: 0, validNodes: 0, names: [], markers: [], merchantTypes: new Set() }; 
                }
                
                let dObj = districtDataMap[dKey]; 
                dObj.total++; 
                dObj.names.push(s.name);
                
                // 收集該區的所有店家類別標籤
                let typeClean = s.merchantType ? (s.merchantType.split(' ')[1] || s.merchantType) : '特約商店';
                dObj.merchantTypes.add(typeClean);
                
                let isIgnited = (s.lat && s.lng); 
                if (isIgnited) {
                    dObj.validNodes++; 
                    let isActive = activeShopIds.has(s.shopId);
                    
                    let iconHtml = isActive ? '<div class="sonar-marker"></div>' : '<div class="standby-marker"></div>';
                    let statusText = isActive ? '<span class="text-radarGreen font-black animate-pulse">🟢 營業發車中</span>' : '<span class="text-yellow-400 font-bold">🟡 未上架整備中</span>';
                    
                    // 🛡️ 單一店家 PopUp 的標籤顏色動態判斷
                    let mTypeColor = typeClean.includes('個體戶') ? 'text-amber-400 border-amber-400/50 bg-amber-900/30' : 'text-emerald-400 border-emerald-400/50 bg-emerald-900/30';
                    let tagsArray = s.tags || []; 
                    
                    let tagsHtml = `<div class="flex flex-wrap justify-center gap-1 mt-1.5 mb-1">
                        <span class="border text-[9px] px-1.5 py-0.5 rounded shadow-sm whitespace-nowrap ${mTypeColor}">${typeClean}</span>
                        ${tagsArray.map(t => `<span class="bg-slate-800 border border-slate-600 text-[9px] px-1.5 py-0.5 rounded text-seefoodYellow shadow-sm whitespace-nowrap">${t}</span>`).join('')}
                    </div>`;
                    
                    let lastOnlineText = s.lastOnline ? `<span class="text-emerald-400">最後動作: ${s.lastOnline}</span>` : `<span class="text-gray-500">尚未留下作戰紀錄</span>`;

                    let myIcon = L.divIcon({ className: isActive ? 'custom-sonar-icon' : 'custom-standby-icon', html: iconHtml, iconSize: [10, 10], iconAnchor: [5, 5] });
                    
                    let popupContent = `
                        <div class="text-center min-w-[150px] p-1">
                            <p class="text-xs font-black text-white mb-0.5 tracking-wide leading-tight">📍 ${s.name}</p>
                            ${tagsHtml}
                            <p class="text-[10px] mt-1.5 mb-1.5">${statusText}</p>
                            <p class="text-[9px] font-mono border-t border-slate-700 pt-1.5 mt-0.5 tracking-tighter">${lastOnlineText}</p>
                        </div>`;

                    let marker = L.marker([s.lat, s.lng], { icon: myIcon }).addTo(map).bindPopup(popupContent);
                    
                    dObj.markers.push(marker); allMarkers.push(marker);
                }

                if (isIgnited) {
                    if (activeShopIds.has(s.shopId)) { tickerMsgs.push(`[${districtClean}] 獵場發車中：${s.name}`); } 
                    else { tickerMsgs.push(`[${districtClean}] 新血加入 準備中：${s.name}`); }
                }
            });

            if (allMarkers.length > 0) { let group = new L.featureGroup(allMarkers); map.fitBounds(group.getBounds().pad(0.2)); }

            const container = document.getElementById('district-container'); container.innerHTML = '';
            
            // 🚀 核心升級：依照該區「總進駐店家數量」由多到少無情排序！
            let sortedDistricts = Object.values(districtDataMap).sort((a, b) => b.total - a.total);

            sortedDistricts.forEach(d => {
                let dKey = `${d.city}_${d.district}`;
                // 只要有任何店家註冊，就展現區域戰情 (遍地開花)
                if (d.total > 0) {
                    if (d.validNodes > 0) tickerMsgs.push(`⚔️ [${d.district}] 獵場全線開放！單店發車持續招募中！`);
                    
                    // 組合區域店家標籤
                    let regionTagsHtml = '';
                    if (d.merchantTypes && d.merchantTypes.size > 0) {
                        Array.from(d.merchantTypes).slice(0, 2).forEach(type => {
                            let badgeColor = type.includes('個體戶') ? 'bg-amber-500/20 text-amber-400 border-amber-500/50' : 'bg-emerald-500/20 text-emerald-400 border-emerald-500/50';
                            regionTagsHtml += `<span class="text-[10px] ${badgeColor} border px-2 py-0.5 rounded-md font-bold tracking-wide mr-1">${type}</span>`;
                        });
                    }

                    container.innerHTML += `
                        <div onclick="focusDistrict('${dKey}', ${d.validNodes})" class="tactical-card ${d.validNodes > 0 ? 'hunting-zone' : ''} rounded-2xl p-4 overflow-hidden mb-4">
                            <div class="flex justify-between items-start mb-3">
                                <div>
                                    <h3 class="font-black text-lg text-white glow-text-green mb-1.5">[${d.city}] ${d.district}</h3>
                                    <div class="flex flex-wrap">${regionTagsHtml}</div>
                                </div>
                                ${d.validNodes > 0 ? `<div class="flex items-center space-x-1.5 mt-1"><span class="text-xl">🔥</span><span class="text-xs font-black bg-red-600 text-white px-2 py-0.5 rounded shadow-md animate-pulse tracking-wide whitespace-nowrap">獵場開放</span></div>` : `<div class="flex items-center mt-1"><span class="text-[10px] font-black bg-slate-700 text-gray-300 px-2 py-1 rounded shadow-md tracking-wide whitespace-nowrap border border-slate-600">雷達座標建置中</span></div>`}
                            </div>
                            <div class="flex justify-between items-center mt-2.5 border-t border-slate-800/60 pt-3">
                                <p class="text-[10px] text-slate-300 font-bold">📡 在地進駐：共 <span class="text-seefoodYellow text-sm">${d.total}</span> 家</p>
                                <span class="text-[9px] text-slate-400 truncate w-1/2 text-right">最新：${d.names.slice(-2).join("、")}</span>
                            </div>
                        </div>`;
                }
            });

            if (sortedDistricts.length === 0) {
                container.innerHTML = '<div class="text-center py-12"><p class="text-slate-500 text-sm">目前全台獵場寂靜... 立刻搶下首位入場勳章！</p></div>';
                tickerMsgs.push("🌍 美食獵人全線號召：全台創始店家限量卡位，單店即刻上架發車！");
            }
            tickerMsgs = tickerMsgs.sort(() => 0.5 - Math.random()).slice(0, 15); document.getElementById('news-ticker').innerText = tickerMsgs.join(" ｜ ") + " ｜ ";
        }

        function focusDistrict(dKey, validNodes) {
            let dObj = districtDataMap[dKey];
            if (dObj.markers && dObj.markers.length > 0) {
                let group = new L.featureGroup(dObj.markers); map.flyToBounds(group.getBounds().pad(0.3), { duration: 1.5 });
                setTimeout(() => {
                    let center = group.getBounds().getCenter();
                    L.popup({ closeButton: false, autoClose: false, className: 'custom-popup' })
                        .setLatLng(center)
                        .setContent(`<div class="text-center min-w-[130px] p-1">
                            <p class="text-red-500 font-black mb-1.5 tracking-wider text-sm">⚔️ 獵場全面開放</p>
                            <p class="text-[10px] text-gray-300 mb-3 leading-tight">目前已集結 ${validNodes} 家店<br>單店即可發車，即刻開搶！</p>
                            <button onclick="joinNow()" class="w-full bg-seefoodYellow text-slate-900 text-xs px-2 py-2 rounded-lg font-black active:scale-95 transition">我要卡位吃肉</button>
                        </div>`).openOn(map);
                }, 1600); 
            } else { alert(`⚠️ 【${dObj.city} ${dObj.district}】已有店家申請入場，但尚未確立官方雷達座標。\n\n您現在立刻卡位，有機率搶下本區「孤勇者首發勳章」！`); joinNow(); }
        }

        function joinNow() { window.location.href = "https://seefood.mangowalkers.workers.dev/#merchant"; }
        function shareToPeers() {
            const shareText = "🔥 SEEFOOD 惜福聯盟：全台獵場點亮中！單店即發車，餐飲老闆們快來免費入場卡位流量！👉 " + window.location.href;
            if (navigator.share) { navigator.share({ title: '全台點燈戰情室', text: shareText, url: window.location.href }).catch(console.error); } else { navigator.clipboard.writeText(shareText).then(() => alert("✅ 號召文案已複製到剪貼簿！快去丟到商圈群組吧！")); }
        }
    </script>
</body>
</html>
