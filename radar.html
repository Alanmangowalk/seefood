<!DOCTYPE html>
<html lang="zh-TW"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>SEEFOOD 獵場戰情室</title>
<script src="https://cdn.tailwindcss.com"></script><script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>tailwind.config={theme:{extend:{colors:{sfYellow:'#F6B800',sfInk:'#0B1F33',sfGreen:'#16A36A',sfSoft:'#F4F7FA'}}}}</script>
<style>body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#eef2f6;color:#0b1f33}#map{height:calc(100dvh - 64px)}.leaflet-control-attribution{font-size:8px}.shop-dot{width:16px;height:16px;border:3px solid white;border-radius:99px;box-shadow:0 3px 12px rgba(11,31,51,.28)}.ticker{overflow:hidden;white-space:nowrap}.ticker-track{display:inline-block;padding-left:100%;animation:ticker 26s linear infinite}@keyframes ticker{to{transform:translateX(-100%)}}.drawer{border-radius:26px 26px 0 0;box-shadow:0 -18px 55px rgba(5,15,25,.25)}@media(min-width:900px){main{max-width:980px}.drawer{max-width:480px;left:50%!important;transform:translateX(-50%)}}</style></head>
<body><main class="max-w-md mx-auto min-h-screen bg-white pb-10">
<header class="px-5 pt-5 pb-4 border-b border-slate-100 bg-white sticky top-0 z-20"><div class="flex justify-between items-center"><div><p class="text-[9px] text-sfGreen font-bold tracking-[.2em]">LIVE RESCUE NETWORK</p><h1 class="text-2xl font-black mt-1">獵場戰情室</h1></div><a href="index.html#home" class="w-10 h-10 rounded-xl bg-slate-100 flex items-center justify-center"><i data-lucide="x" class="w-5 h-5"></i></a></div></header>
<section class="px-4 pt-4">
<div class="grid grid-cols-3 gap-2"><div class="rounded-2xl bg-sfInk text-white p-4"><p class="text-[9px] text-slate-400">在線獵場</p><p id="hero-active" class="text-3xl font-black mt-1">0</p></div><div class="rounded-2xl bg-sfSoft p-4"><p class="text-[9px] text-slate-400">已進駐</p><p id="hero-total" class="text-3xl font-black mt-1">0</p></div><div class="rounded-2xl bg-sfSoft p-4"><p class="text-[9px] text-slate-400">在線獵物</p><p id="hero-items" class="text-3xl font-black text-sfGreen mt-1">0</p></div></div>
<div class="mt-3 rounded-2xl border border-slate-200 bg-white p-3 flex gap-2"><button onclick="locateMe()" class="flex-1 bg-sfInk text-white rounded-xl py-3 text-xs font-black flex items-center justify-center gap-2"><i data-lucide="locate-fixed" class="w-4 h-4"></i>我的附近</button><button onclick="openMap()" class="flex-1 bg-sfYellow text-sfInk rounded-xl py-3 text-xs font-black flex items-center justify-center gap-2"><i data-lucide="map" class="w-4 h-4"></i>完整地圖</button></div>
</section>
<div class="mt-4 border-y border-slate-100 bg-slate-50 py-2 ticker"><div id="ticker" class="ticker-track text-[10px] font-bold text-slate-600">SEEFOOD 獵場情報更新中</div></div>
<section class="p-4 space-y-3"><div class="flex justify-between items-end"><div><h2 class="font-black text-lg">熱門獵場</h2><p class="text-[10px] text-slate-400">先看即時情報，再決定往哪裡出發</p></div><span class="text-[9px] text-slate-400">LIVE</span></div><div id="district-list" class="space-y-2"></div></section>
</main>
<div id="map-modal" class="fixed inset-0 z-50 bg-white hidden"><div class="h-16 flex items-center justify-between px-4 border-b border-slate-100 bg-white"><button onclick="closeMap()" class="w-10 h-10 rounded-xl bg-slate-100 flex items-center justify-center"><i data-lucide="chevron-left" class="w-5 h-5"></i></button><div class="text-center"><p class="font-black">獵場地圖</p><p class="text-[9px] text-slate-400">點選光點查看店家情報</p></div><button onclick="returnToMyPosition()" class="w-10 h-10 rounded-xl bg-sfInk text-white flex items-center justify-center"><i data-lucide="locate-fixed" class="w-4 h-4"></i></button></div><div id="map"></div></div>
<div id="shop-drawer-wrap" class="fixed inset-0 z-[60] hidden bg-black/25" onclick="if(event.target===this)closeShopDrawer()"><div id="shop-drawer" class="drawer absolute bottom-0 left-0 right-0 bg-white p-5"><div class="flex justify-between gap-3"><div class="min-w-0"><div class="flex gap-2 items-center"><span id="drawer-title-badge" class="text-[9px] px-2 py-1 rounded-full bg-amber-100 text-amber-700 font-black">新進獵場</span><span id="drawer-verify" class="text-[9px] px-2 py-1 rounded-full bg-slate-100 text-slate-500 font-bold">驗證中</span></div><h3 id="drawer-name" class="text-xl font-black mt-2 truncate">店鋪</h3><p id="drawer-area" class="text-xs text-slate-400 mt-1"></p></div><button onclick="closeShopDrawer()" class="w-9 h-9 bg-slate-100 rounded-xl flex items-center justify-center flex-none"><i data-lucide="x" class="w-4 h-4"></i></button></div><div class="grid grid-cols-3 gap-2 mt-4"><div class="bg-sfSoft rounded-xl p-3"><p class="text-[9px] text-slate-400">目前獵物</p><p id="drawer-items" class="font-black text-lg">0</p></div><div class="bg-sfSoft rounded-xl p-3"><p class="text-[9px] text-slate-400">待救數量</p><p id="drawer-remain" class="font-black text-lg">0</p></div><div class="bg-sfSoft rounded-xl p-3"><p class="text-[9px] text-slate-400">最近上架</p><p id="drawer-last" class="font-black text-xs mt-1">—</p></div></div><div id="drawer-tags" class="flex flex-wrap gap-1.5 mt-3"></div><div class="mt-4 grid grid-cols-2 gap-2"><button onclick="focusSelectedShop()" class="border border-slate-200 rounded-xl py-3 text-xs font-black">在地圖查看</button><button id="drawer-hunt" class="bg-sfYellow rounded-xl py-3 text-xs font-black">查看獵物</button></div></div></div>
<script>
const gasUrl="https://script.google.com/macros/s/AKfycbxOsS40qejUGDKjp0kQFn76CeM0DBiTN41HHorYJ6gBa9qK1fTEP3xDRbn7CgXo3C4Z9g/exec";let payload=null,map=null,markers={},userMarker=null,lastUserLatLng=null,selectedShop=null;
const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function load(){try{const r=await fetch(gasUrl+'?t='+Date.now()),j=await r.json();payload=j;render(j);}catch(e){document.getElementById('district-list').innerHTML='<div class="p-5 rounded-2xl bg-red-50 border border-red-100 text-sm text-red-700">戰情資料連線失敗，請稍後重試。</div>';}finally{icons();}}
function render(j){const stores=j.stores||[],merchants=j.allMerchants||[];document.getElementById('hero-active').textContent=new Set(stores.map(s=>s.shopId)).size;document.getElementById('hero-total').textContent=j.registeredStores||merchants.length;document.getElementById('hero-items').textContent=stores.length;const news=(j.latestNews||[]).map(n=>n.text);document.getElementById('ticker').textContent=(news.length?news:['SEEFOOD 全台獵場即時掃描中']).join('　　•　　');const d={};merchants.forEach(m=>{const k=(m.city||'其他')+' '+(m.district||'');if(!d[k])d[k]={city:m.city,district:m.district,total:0,active:0,items:0,remain:0};d[k].total++;});stores.forEach(s=>{const k=(s.city||'其他')+' '+(s.district||'');if(!d[k])d[k]={city:s.city,district:s.district,total:0,active:0,items:0,remain:0};d[k].items++;d[k].remain+=Number(s.remain)||0;});Object.values(d).forEach(x=>x.active=new Set(stores.filter(s=>s.city===x.city&&s.district===x.district).map(s=>s.shopId)).size);const arr=Object.values(d).sort((a,b)=>b.active-a.active||b.items-a.items||b.total-a.total);document.getElementById('district-list').innerHTML=arr.length?arr.map(x=>`<button onclick="focusDistrict('${esc(x.city)}','${esc(x.district)}')" class="w-full text-left rounded-2xl p-4 border border-slate-200 bg-white shadow-sm"><div class="flex justify-between items-start"><div><p class="font-black text-base">${esc(x.city)} ${esc(x.district)}</p><p class="text-[10px] text-slate-400 mt-1">${x.total} 家進駐 · ${x.items} 個獵物 · ${x.remain} 份待救</p></div><span class="text-[10px] px-2 py-1 rounded-full ${x.active?'bg-emerald-50 text-emerald-700':'bg-slate-100 text-slate-400'} font-black">${x.active?x.active+' 家在線':'整備中'}</span></div></button>`).join(''):'<p class="text-center text-slate-400 py-10">目前尚無獵場資料</p>'}
function ensureMap(){if(map)return;map=L.map('map',{zoomControl:true}).setView([23.7,121],7);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap'}).addTo(map);(payload?.allMerchants||[]).forEach(m=>{if(!m.lat||!m.lng)return;const active=(payload.stores||[]).some(s=>s.shopId===m.shopId);const icon=L.divIcon({className:'',html:`<div class="shop-dot" style="background:${active?'#16A36A':'#E3B341'}"></div>`,iconSize:[16,16]});const mk=L.marker([m.lat,m.lng],{icon}).addTo(map).on('click',()=>showShopDrawer(m));markers[m.shopId]=mk;});}
function openMap(){document.getElementById('map-modal').classList.remove('hidden');setTimeout(()=>{ensureMap();map.invalidateSize();icons();},30)}function closeMap(){document.getElementById('map-modal').classList.add('hidden');closeShopDrawer()}
function focusDistrict(city,district){openMap();setTimeout(()=>{const ms=(payload?.allMerchants||[]).filter(m=>m.city===city&&m.district===district&&markers[m.shopId]).map(m=>markers[m.shopId]);if(ms.length)map.fitBounds(L.featureGroup(ms).getBounds().pad(.35));},120)}
function locateMe(){openMap();navigator.geolocation?.getCurrentPosition(p=>{lastUserLatLng=[p.coords.latitude,p.coords.longitude];drawUser();},()=>alert('請允許定位後再試一次'),{enableHighAccuracy:true,maximumAge:30000,timeout:8000})}
function drawUser(){ensureMap();if(!lastUserLatLng)return;if(userMarker)userMarker.remove();userMarker=L.circleMarker(lastUserLatLng,{radius:8,color:'#2563eb',weight:3,fillColor:'#60a5fa',fillOpacity:.9}).addTo(map).bindTooltip('你在這裡');map.setView(lastUserLatLng,15)}
function returnToMyPosition(){if(lastUserLatLng){drawUser();return}locateMe()}
function showShopDrawer(m){selectedShop=m;document.getElementById('drawer-name').textContent=m.name||'店鋪';document.getElementById('drawer-area').textContent=((m.city||'')+' '+(m.district||'')).trim();document.getElementById('drawer-title-badge').textContent=m.title||'獵場';document.getElementById('drawer-verify').textContent=m.verified?'已實名':'驗證中';document.getElementById('drawer-verify').className='text-[9px] px-2 py-1 rounded-full font-bold '+(m.verified?'bg-emerald-50 text-emerald-700':'bg-slate-100 text-slate-500');document.getElementById('drawer-items').textContent=m.activeItems||0;document.getElementById('drawer-remain').textContent=m.totalRemain||0;document.getElementById('drawer-last').textContent=m.lastOnline||'尚無紀錄';const tags=m.tags||[];document.getElementById('drawer-tags').innerHTML=tags.map(t=>`<span class="text-[9px] bg-slate-100 text-slate-600 rounded-full px-2 py-1 font-bold">${esc(t.replace(/[🔥🐺]/g,''))}</span>`).join('');document.getElementById('drawer-hunt').onclick=()=>goHunt(m.shopId);document.getElementById('shop-drawer-wrap').classList.remove('hidden');icons()}
function closeShopDrawer(){document.getElementById('shop-drawer-wrap').classList.add('hidden')}
function focusSelectedShop(){if(!selectedShop)return;closeShopDrawer();openMap();setTimeout(()=>{const mk=markers[selectedShop.shopId];if(mk)map.setView(mk.getLatLng(),16)},60)}
function goHunt(id){location.href=`index.html?targetShopId=${encodeURIComponent(id)}#home`}
function icons(){try{lucide.createIcons()}catch(e){}}load();
</script></body></html>
