<!DOCTYPE html>
<html lang="zh-TW"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>SEEFOOD 全台獵場戰情室</title>
<script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>tailwind.config={theme:{extend:{colors:{seefoodYellow:'#FAB900',ink:'#081727',radarGreen:'#10b981'}}}}</script>
<style>body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#07111f}#map{height:70dvh}.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:#0f1d2e;color:white}.pulse{box-shadow:0 0 0 rgba(16,185,129,.45);animation:p 1.8s infinite}@keyframes p{70%{box-shadow:0 0 0 12px rgba(16,185,129,0)}100%{box-shadow:0 0 0 0 rgba(16,185,129,0)}}</style></head>
<body class="text-white min-h-screen"><main class="max-w-md mx-auto min-h-screen bg-ink pb-24">
<header class="px-5 pt-5 pb-4 border-b border-white/10"><div class="flex justify-between items-center"><div><p class="text-[10px] text-emerald-400 font-bold tracking-[.25em]">SEEFOOD LIVE NETWORK</p><h1 class="text-2xl font-black mt-1">全台獵場戰情室</h1></div><a href="index.html#home" class="text-xs bg-white/10 px-3 py-2 rounded-xl">返回獵物</a></div></header>
<section class="p-4 space-y-4"><div class="rounded-3xl p-5 bg-gradient-to-br from-slate-900 to-slate-950 border border-white/10 shadow-2xl"><div class="flex items-center justify-between"><div><p class="text-xs text-slate-400">現在正在救援</p><p id="hero-active" class="text-4xl font-black text-seefoodYellow mt-1">0</p><p class="text-xs text-slate-400 mt-1">間店鋪在線</p></div><div class="w-16 h-16 rounded-full border border-emerald-400/40 flex items-center justify-center pulse"><span class="text-2xl">📡</span></div></div><div class="grid grid-cols-3 gap-2 mt-5"><div class="bg-white/5 rounded-xl p-3"><p class="text-[9px] text-slate-500">已進駐</p><p id="hero-total" class="font-black text-lg">0</p></div><div class="bg-white/5 rounded-xl p-3"><p class="text-[9px] text-slate-500">在線獵物</p><p id="hero-items" class="font-black text-lg text-emerald-400">0</p></div><button onclick="locateMe()" class="bg-seefoodYellow text-slate-900 rounded-xl p-3 text-left"><p class="text-[9px] font-bold">MY GPS</p><p class="font-black text-sm">附近獵場</p></button></div></div>
<div class="flex items-center justify-between"><div><h2 class="font-black text-lg">熱門獵場</h2><p class="text-[10px] text-slate-500">先看情報，需要空間位置再開地圖</p></div><button onclick="openMap()" class="text-[11px] font-black border border-emerald-500/40 text-emerald-300 px-3 py-2 rounded-xl">🗺️ 開啟地圖</button></div><div id="district-list" class="space-y-2"></div></section>
<div id="map-modal" class="fixed inset-0 z-50 bg-slate-950 hidden"><div class="h-16 flex items-center justify-between px-4 border-b border-white/10"><div><p class="font-black">全螢幕獵場地圖</p><p class="text-[9px] text-slate-500">點光點查看商家情報</p></div><button onclick="closeMap()" class="bg-white/10 px-4 py-2 rounded-xl font-black">關閉</button></div><div id="map"></div></div>
</main><script>
const gasUrl="https://script.google.com/macros/s/AKfycbxOsS40qejUGDKjp0kQFn76CeM0DBiTN41HHorYJ6gBa9qK1fTEP3xDRbn7CgXo3C4Z9g/exec";let payload=null,map=null,markers={},userMarker=null;
async function load(){try{const r=await fetch(gasUrl+'?t='+Date.now()),j=await r.json();payload=j;render(j);}catch(e){document.getElementById('district-list').innerHTML='<div class="p-5 rounded-2xl bg-red-950/30 border border-red-500/20 text-sm">戰情資料連線失敗，請稍後重試。</div>';}}
function render(j){const stores=j.stores||[],merchants=j.allMerchants||[];document.getElementById('hero-active').textContent=new Set(stores.map(s=>s.shopId)).size;document.getElementById('hero-total').textContent=j.registeredStores||merchants.length;document.getElementById('hero-items').textContent=stores.length;const d={};merchants.forEach(m=>{const k=(m.city||'其他')+' '+(m.district||'');if(!d[k])d[k]={city:m.city,district:m.district,total:0,active:0,items:0,shops:[]};d[k].total++;d[k].shops.push(m);});stores.forEach(s=>{const k=(s.city||'其他')+' '+(s.district||'');if(!d[k])d[k]={city:s.city,district:s.district,total:0,active:0,items:0,shops:[]};d[k].items++;});Object.values(d).forEach(x=>{x.active=new Set(stores.filter(s=>s.city===x.city&&s.district===x.district).map(s=>s.shopId)).size;});const arr=Object.values(d).sort((a,b)=>b.active-a.active||b.items-a.items||b.total-a.total);document.getElementById('district-list').innerHTML=arr.length?arr.map(x=>`<button onclick="focusDistrict('${esc(x.city)}','${esc(x.district)}')" class="w-full text-left rounded-2xl p-4 border ${x.active?'border-emerald-500/30 bg-emerald-950/15':'border-white/10 bg-white/[.03]'}"><div class="flex justify-between items-start"><div><p class="font-black text-base">${esc(x.city)} ${esc(x.district)}</p><p class="text-[10px] text-slate-500 mt-1">${x.total} 家已進駐 · ${x.items} 個獵物</p></div><span class="text-[10px] px-2 py-1 rounded-full ${x.active?'bg-emerald-500 text-slate-950 font-black':'bg-white/10 text-slate-400'}">${x.active?x.active+' 家在線':'整備中'}</span></div></button>`).join(''):'<p class="text-center text-slate-500 py-10">目前尚無獵場資料</p>';}
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function ensureMap(){if(map)return;map=L.map('map').setView([23.7,121],7);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap'}).addTo(map);(payload?.allMerchants||[]).forEach(m=>{if(!m.lat||!m.lng)return;const active=(payload.stores||[]).some(s=>s.shopId===m.shopId);const icon=L.divIcon({className:'',html:`<div style="width:14px;height:14px;border-radius:99px;background:${active?'#10b981':'#eab308'};border:2px solid white;box-shadow:0 0 12px ${active?'#10b981':'#eab308'}"></div>`,iconSize:[14,14]});const mk=L.marker([m.lat,m.lng],{icon}).addTo(map).bindPopup(`<div style="min-width:180px"><b>${esc(m.name)}</b><br><small>${active?'🟢 獵場開放':'🟡 整備中'}</small>${active?`<br><button style="margin-top:8px;width:100%;padding:8px;background:#10b981;border:0;border-radius:10px;font-weight:800" onclick="goHunt('${m.shopId}')">進入獵場</button>`:''}</div>`);markers[m.shopId]=mk;});}
function openMap(){document.getElementById('map-modal').classList.remove('hidden');setTimeout(()=>{ensureMap();map.invalidateSize();},50);}function closeMap(){document.getElementById('map-modal').classList.add('hidden');}
function focusDistrict(city,district){openMap();setTimeout(()=>{const ms=(payload?.allMerchants||[]).filter(m=>m.city===city&&m.district===district&&markers[m.shopId]).map(m=>markers[m.shopId]);if(ms.length)map.fitBounds(L.featureGroup(ms).getBounds().pad(.35));},120);}
function locateMe(){openMap();navigator.geolocation?.getCurrentPosition(p=>{ensureMap();const ll=[p.coords.latitude,p.coords.longitude];if(userMarker)userMarker.remove();userMarker=L.circleMarker(ll,{radius:8,color:'#60a5fa',fillOpacity:.8}).addTo(map).bindPopup('你在這裡');map.setView(ll,14);},()=>alert('請允許定位後再試一次'));}
function goHunt(id){location.href=`index.html#home?targetShopId=${id}`;}load();
</script></body></html>
