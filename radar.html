<style>

.main{display:grid;grid-template-columns:330px minmax(0,1fr);min-height:calc(100dvh - 180px)}.side{border-right:1px solid #edf0f2;padding:14px;overflow:auto}.mapwrap{position:relative}.map{height:calc(100dvh - 180px);min-height:560px}.section-head{display:flex;justify-content:space-between;align-items:end;margin-bottom:10px}.section-head h2{font-size:17px;margin:0}.section-head p{font-size:9px;color:#8A96A3;margin:3px 0 0}.district{width:100%;border:1px solid #E0E6EB;background:#fff;border-radius:15px;padding:12px;text-align:left;margin-bottom:8px}.district b{font-size:12px}.district p{font-size:9px;color:#7B8792;margin:4px 0 0}.district .right{float:right;font-size:8px;font-weight:900;border-radius:999px;padding:4px 7px;background:#ECF8F3;color:#187A55}
.shop-marker{position:relative;width:30px;height:30px;border-radius:50%;border:3px solid #fff;box-shadow:0 5px 16px rgba(7,21,34,.28);display:grid;place-items:center;color:#fff;font-size:10px;font-weight:950}.shop-marker.active{background:#20A36A}.shop-marker.idle{background:#17344F}.shop-marker.hot{box-shadow:0 0 0 6px rgba(244,180,26,.18),0 5px 16px rgba(7,21,34,.28)}.shop-marker.watched{box-shadow:0 0 0 5px #FFD45C,0 5px 16px rgba(7,21,34,.30)}.shop-marker.watched:after{content:"✓";position:absolute;right:-8px;bottom:-8px;width:17px;height:17px;border-radius:50%;background:#FFD45C;color:#0B2239;border:2px solid #fff;display:grid;place-items:center;font-size:9px;font-weight:1000}.knock-badge{position:absolute;right:-10px;top:-10px;min-width:18px;height:18px;border-radius:999px;background:#F4B41A;color:#0B2239;border:2px solid #fff;display:grid;place-items:center;font-size:8px;font-weight:950;padding:0 4px}
.locate{position:absolute;right:14px;bottom:18px;z-index:500;height:44px;border:0;border-radius:14px;background:#fff;box-shadow:0 8px 22px rgba(7,21,34,.18);color:var(--navy);display:flex;align-items:center;justify-content:center;gap:7px;padding:0 13px;font-size:10px;font-weight:900}.locate .locate-label{display:none}.locate.drawer-hidden{display:none!important}
.drawer-bg{position:fixed;inset:0;background:rgba(4,15,24,.28);z-index:900}.drawer-bg.hidden{display:none}.drawer{position:absolute;right:20px;bottom:20px;width:min(420px,calc(100% - 40px));background:#fff;border-radius:24px;padding:18px;box-shadow:0 22px 65px rgba(4,15,24,.26)}.drawer h3{font-size:21px;margin:6px 0 0}.status-row{display:flex;gap:6px;flex-wrap:wrap}.pill{font-size:8px;font-weight:900;padding:5px 7px;border-radius:999px;background:#EEF2F5;color:#60707E}.pill.live{background:#E9F8F1;color:#16764F}.pill.plus{background:#FFF2C6;color:#795500}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}.stat{background:#F6F8FA;border-radius:13px;padding:10px}.stat small{font-size:8px;color:#7D8994}.stat b{display:block;font-size:17px;margin-top:2px}.demand{margin-top:12px;background:#FFF8DF;border:1px solid #F0DA95;border-radius:14px;padding:12px}.demand b{font-size:13px}.demand p{font-size:9px;color:#7D6B38;margin:4px 0 0}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.btn{border:0;border-radius:12px;padding:12px;font-size:11px;font-weight:950}.primary{background:var(--yellow);color:var(--navy)}.secondary{background:var(--navy);color:#fff}.ghost{background:#F0F3F5;color:var(--navy)}.watchline{display:flex;align-items:center;justify-content:space-between;gap:10px;border:1px solid #E1E6EA;border-radius:13px;padding:10px 12px;margin-top:9px}.watchline b,.watchline span{display:block}.watchline b{font-size:11px}.watchline span{font-size:8px;color:#7B8792;margin-top:2px}.switch{width:42px;height:25px;border-radius:999px;background:#D6DDE3;border:0;position:relative}.switch:after{content:"";width:19px;height:19px;background:#fff;border-radius:50%;position:absolute;left:3px;top:3px;transition:.2s;box-shadow:0 1px 4px rgba(0,0,0,.18)}.switch.on{background:#20A36A}.switch.on:after{left:20px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:1500;background:#0B2239;color:#fff;border-radius:12px;padding:11px 14px;font-size:11px;font-weight:850;box-shadow:0 12px 28px rgba(0,0,0,.22)}.toast.hidden{display:none}
@media(max-width:800px){.summary{grid-template-columns:repeat(2,1fr)}.main{display:block}.side{display:none}.map{height:calc(100dvh - 230px);min-height:480px}.drawer{right:0;bottom:0;width:100%;border-radius:24px 24px 0 0}.top{height:62px}.main{min-height:0}}

.mobile-districts{display:none}.search-state{padding:12px;font-size:10px;color:#73808D;line-height:1.55}.search-state b{display:block;color:#0B2239;font-size:11px;margin-bottom:3px}
@media(max-width:800px){
  .top{height:56px;padding:0 16px}.title{font-size:20px}.kicker{font-size:8px}.close{width:36px;height:36px}
  .toolbar{padding:10px 12px}.search{height:42px;border-radius:14px;padding-left:39px;font-size:12px}.searchicon{top:12px}.clear{top:6px}
  .summary{grid-template-columns:repeat(4,1fr);gap:6px;padding:8px 12px}.metric{padding:9px 8px;border-radius:12px;min-width:0}.metric small{font-size:7px;white-space:nowrap}.metric b{font-size:18px;margin-top:1px}
  .mobile-districts{display:flex;gap:7px;overflow-x:auto;padding:0 12px 8px;scrollbar-width:none}.mobile-districts::-webkit-scrollbar{display:none}.mobile-districts button{flex:none;border:1px solid #E1E6EA;background:#fff;border-radius:999px;padding:7px 10px;font-size:9px;font-weight:850;color:#4E5E6C}.mobile-districts button.hot{background:#FFF5D3;border-color:#EBD487;color:#765300}
  .map{height:calc(100dvh - 214px);min-height:420px}.locate{position:fixed;right:14px;bottom:20px;z-index:760;width:auto;max-width:150px;border:1px solid #DDE4EA}.locate .locate-label{display:inline}.leaflet-control-attribution{font-size:7px!important;background:rgba(255,255,255,.86)!important;padding:2px 5px!important;border-radius:0 0 0 7px!important}
}


.radar-ticker{height:34px;border-top:1px solid #EEF1F4;border-bottom:1px solid #EEF1F4;background:#FCFDFD;overflow:hidden;display:flex;align-items:center}.radar-ticker.hidden{display:none}
.radar-ticker-badge{height:100%;display:flex;align-items:center;padding:0 10px;background:#0B2239;color:#FFD36A;font-size:8px;font-weight:950;letter-spacing:.08em;white-space:nowrap;z-index:2}
.radar-ticker-window{overflow:hidden;flex:1}.radar-ticker-track{display:flex;width:max-content;gap:36px;white-space:nowrap;animation:radarTicker 26s linear infinite;padding-left:20px}
.radar-ticker-item{border:0;background:transparent;font-size:9px;color:#53616E;font-weight:800;padding:0}.radar-ticker-item b{color:#0B2239}
@keyframes radarTicker{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@media(max-width:800px){.radar-ticker{height:31px}.radar-ticker-badge{font-size:7px;padding:0 8px}.radar-ticker-item{font-size:8px}.radar-ticker-track{gap:28px;animation-duration:22s}}


.radar-loading{position:fixed;inset:0;z-index:900;background:rgba(246,248,250,.94);backdrop-filter:blur(7px);display:flex;align-items:center;justify-content:center;padding:24px;transition:opacity .25s}
.radar-loading.hidden{display:none}.radar-loading-card{width:min(320px,90vw);background:#fff;border:1px solid #E3E9EE;border-radius:22px;padding:22px;text-align:center;box-shadow:0 16px 50px rgba(11,34,57,.14)}
.radar-loader-ring{width:58px;height:58px;border-radius:50%;margin:0 auto 14px;border:3px solid #E8EDF1;border-top-color:#F4B41A;position:relative;animation:radarSpin .9s linear infinite}
.radar-loader-ring:after{content:"";position:absolute;inset:10px;border-radius:50%;border:2px dashed #0B2239;opacity:.65}
.radar-loading-card b{display:block;color:#0B2239;font-size:14px}.radar-loading-card p{color:#7B8793;font-size:10px;line-height:1.6;margin:6px 0 0}.radar-loading-card small{display:block;color:#A3ADB7;font-size:8px;margin-top:9px}
@keyframes radarSpin{to{transform:rotate(360deg)}}
.sf-google-search-cta{width:100%;border:0;border-top:1px solid #E7ECF1;background:#F8FAFC;color:#0B2239;padding:11px 13px;display:flex;align-items:center;justify-content:space-between;font-weight:900;font-size:10px;text-align:left}
.sf-google-search-cta small{display:block;font-size:8px;color:#7D8995;font-weight:650;margin-top:2px}.sf-google-search-cta .go{flex:none;border-radius:999px;background:#0B2239;color:#fff;padding:6px 9px;font-size:8px}.sf-google-search-cta:disabled{opacity:.55}
</style>
<style id="seefood-perf-audit-style">
#sf-perf-audit{display:none;position:fixed;left:8px;right:8px;bottom:84px;z-index:999999;background:rgba(7,25,43,.96);color:white;border:1px solid rgba(255,255,255,.15);border-radius:14px;padding:10px 12px;max-height:34vh;overflow:auto;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:10px;line-height:1.45}
#sf-perf-audit.on{display:block}#sf-perf-audit b{color:#FFD36A}#sf-perf-audit .bad{color:#FF9A9E}#sf-perf-audit .good{color:#75E2B4}
</style>

<script id="seefood-perf-audit-script">
window.__SF_PERF_ON=true;
sessionStorage.setItem('sf_perf_mode','1');
window.__SF_PERF_LOG=[];
window.sfPerfLog=function(name,total,detail){
  if(!window.__SF_PERF_ON)return;
  const row={t:new Date().toLocaleTimeString('zh-TW',{hour12:false}),name,total:Math.round(Number(total)||0),detail:detail||{}};
  __SF_PERF_LOG.push(row);if(__SF_PERF_LOG.length>20)__SF_PERF_LOG.shift();
  const box=document.getElementById('sf-perf-audit'),lines=document.getElementById('sf-perf-lines');if(box)box.classList.add('on');
  if(lines)lines.innerHTML=__SF_PERF_LOG.slice().reverse().map(x=>{
    const cls=x.total<=2000?'good':x.total>=5000?'bad':'';
    let d='';try{d=Object.entries(x.detail||{}).map(([k,v])=>k+'='+((typeof v==='object')?JSON.stringify(v):v)).join(' · ')}catch(_e){}
    return `<div class="${cls}">${x.t}｜${x.name}｜${x.total}ms${d?'｜'+d:''}</div>`;
  }).join('');
};

window.addEventListener('DOMContentLoaded',()=>{
  try{
    const box=document.getElementById('sf-perf-audit');
    if(box){box.classList.add('on');}
    const lines=document.getElementById('sf-perf-lines');
    if(lines && !lines.dataset.booted){
      lines.dataset.booted='1';
      lines.innerHTML='<div class="good">PERF MODE ACTIVE · 等待操作…</div>';
    }
  }catch(_e){}
});

</script>
</head>
<body><div id="sf-perf-audit"><b>SEEFOOD PERF AUDIT</b><div id="sf-perf-lines">等待操作…</div></div><div class="shell">
<header class="top"><div><div class="kicker">LIVE DEMAND × SUPPLY</div><div class="title">獵場戰情室 2.0</div></div><a href="index.html#home" class="close"><i data-lucide="x"></i></a></header>
<div id="radar-loading" class="radar-loading"><div class="radar-loading-card"><div class="radar-loader-ring"></div><b id="radar-loading-title">正在掃描附近獵場</b><p id="radar-loading-desc">先把地圖叫醒，再同步最新獵物與敲碗情報。</p><small>LIVE RADAR</small></div></div>
<section class="toolbar"><div class="searchwrap"><i data-lucide="search" class="searchicon" width="18"></i><input id="place-search" class="search" placeholder="搜尋 SEEFOOD 獵場、店家或 Google 地點" autocomplete="off"><button class="clear" onclick="clearSearch()"><i data-lucide="x" width="15"></i></button><div id="search-results" class="search-results hidden"></div></div></section>
<section class="summary"><div class="metric"><small>在線獵場</small><b id="m-active">0</b></div><div class="metric"><small>已進駐</small><b id="m-total">0</b></div><div class="metric"><small>今日敲碗</small><b id="m-knocks" class="green">0</b></div><div class="metric"><small>在線獵物</small><b id="m-items">0</b></div></section><div id="radar-ticker" class="radar-ticker hidden"><div class="radar-ticker-badge">獵場速報</div><div class="radar-ticker-window"><div id="radar-ticker-track" class="radar-ticker-track"></div></div></div><div id="mobile-districts" class="mobile-districts"></div>
<div class="main"><aside class="side"><div class="section-head"><div><h2>需求熱區</h2><p>在線供給與今日敲碗一起看</p></div></div><div id="district-list"></div></aside><section class="mapwrap"><div id="map" class="map"></div><button class="locate" onclick="locateMe()" aria-label="回到我附近"><i data-lucide="locate-fixed" width="18"></i><span class="locate-label">回到我附近</span></button></section></div>
</div>
<div id="drawer-bg" class="drawer-bg hidden" onclick="if(event.target===this)closeDrawer()"><div class="drawer"><div style="display:flex;justify-content:space-between;gap:12px"><div><div id="d-pills" class="status-row"></div><h3 id="d-name">獵場</h3><p id="d-area" style="font-size:10px;color:#7D8994;margin:4px 0 0"></p></div><button class="close" onclick="closeDrawer()"><i data-lucide="x"></i></button></div><div class="stats"><div class="stat"><small>目前獵物</small><b id="d-items">0</b></div><div class="stat"><small>剩餘份數</small><b id="d-remain">0</b></div><div class="stat"><small>今日敲碗</small><b id="d-knock">0</b></div></div><div id="d-demand" class="demand"></div><div id="d-watch" class="watchline"><div><b>上架叫我</b><span>這家店一開賣，就通知你。</span></div><button id="d-watch-btn" class="switch" onclick="toggleWatch()"></button></div><div id="d-actions" class="actions"></div></div></div>
<div id="toast" class="toast hidden"></div>
<script>
const GAS="https://script.google.com/macros/s/AKfycbxOsS40qejUGDKjp0kQFn76CeM0DBiTN41HHorYJ6gBa9qK1fTEP3xDRbn7CgXo3C4Z9g/exec";
const uid=localStorage.getItem('seefood_line_uid')||'LINE_GUEST';
let payload={stores:[],allMerchants:[]},map,markers={},selected=null,userPos=null,userMarker=null,searchTimer=null,myWatchIds=new Set(),placesConfigured=true;
const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(action,data={},timeout=9000){const p=new URLSearchParams({action,...data}),c=new AbortController(),t=setTimeout(()=>c.abort(),timeout);try{const r=await fetch(GAS,{method:'POST',body:p,signal:c.signal});return await r.json()}finally{clearTimeout(t)}}
function icons(){try{lucide.createIcons()}catch(e){}}
function toast(t){const x=document.getElementById('toast');x.textContent=t;x.classList.remove('hidden');setTimeout(()=>x.classList.add('hidden'),2400)}
function isActiveShop(id){return payload.stores.some(s=>String(s.shopId)===String(id)&&Number(s.remain)>0)}
function shopRemain(id){return payload.stores.filter(s=>String(s.shopId)===String(id)).reduce((a,b)=>a+(Number(b.remain)||0),0)}
function shopItems(id){return payload.stores.filter(s=>String(s.shopId)===String(id)&&Number(s.remain)>0).length}
function radarLoading(stage){
  const box=document.getElementById('radar-loading'),title=document.getElementById('radar-loading-title'),desc=document.getElementById('radar-loading-desc');if(!box)return;
  if(stage==='hide'){box.classList.add('hidden');return}box.classList.remove('hidden');
  if(stage==='slow'){if(title)title.textContent='正在同步最新獵場情報';if(desc)desc.textContent='資料量較多，再等一下就能開始狩獵。';}
  else if(stage==='cached'){if(title)title.textContent='已載入最近情報';if(desc)desc.textContent='正在背景更新最新敲碗與開賣狀態。';}
}
function applyRadarPayload(j,fit=true){payload=j||{stores:[],allMerchants:[]};renderSummary();renderDistricts();renderTicker();renderMapData(fit)}
async function load(){
  const __r0=performance.now();buildMap();let painted=false;
  try{const c=JSON.parse(localStorage.getItem('sf_radar_public_cache')||'null');if(c&&c.ts&&Date.now()-Number(c.ts)<600000&&c.data){applyRadarPayload(c.data,true);painted=true;radarLoading('cached')}}catch(_e){}
  const slowTimer=setTimeout(()=>radarLoading('slow'),6000);
  try{
    const __rn0=performance.now();const r=await fetch(GAS,{cache:'no-store'}),j=await r.json();const __rn=performance.now()-__rn0;localStorage.setItem('sf_radar_public_cache',JSON.stringify({ts:Date.now(),data:j}));
    applyRadarPayload(j,!painted);radarLoading('hide');sfPerfLog('RADAR LOAD',performance.now()-__r0,{network:Math.round(__rn),server:j?._perf?.totalMs??'',cache:j?._perf?.cacheHit??'',marks:j?._perf?.marks??''});loadMyWatches();
    const q=new URLSearchParams(location.search).get('shopId');if(q){const mm=(payload.allMerchants||[]).find(x=>String(x.shopId)===q);if(mm)setTimeout(()=>showMerchant(mm),250)}
  }catch(e){if(painted){radarLoading('hide');toast('目前顯示最近一次獵場情報')}else{radarLoading('slow');toast('戰情資料連線較慢，請稍後重試')}}
  finally{clearTimeout(slowTimer);icons()}
}
function renderSummary(){const ms=payload.allMerchants||[],active=new Set((payload.stores||[]).filter(s=>Number(s.remain)>0).map(s=>s.shopId));document.getElementById('m-active').textContent=active.size;document.getElementById('m-total').textContent=payload.registeredStores||ms.length;document.getElementById('m-items').textContent=(payload.stores||[]).filter(s=>Number(s.remain)>0).length;document.getElementById('m-knocks').textContent=ms.reduce((a,m)=>a+(Number(m.knockToday)||0),0)}
function renderDistricts(){const d={};(payload.allMerchants||[]).forEach(m=>{const k=(m.city||'其他')+' '+(m.district||'');d[k]??={city:m.city,district:m.district,total:0,active:0,knocks:0};d[k].total++;d[k].knocks+=Number(m.knockToday)||0;if(isActiveShop(m.shopId))d[k].active++});const arr=Object.values(d).sort((a,b)=>b.knocks-a.knocks||b.active-a.active||b.total-a.total);document.getElementById('district-list').innerHTML=arr.map(x=>`<button class="district" onclick="focusDistrict('${esc(x.city)}','${esc(x.district)}')"><span class="right">${x.knocks?x.knocks+' 人敲碗':x.active+' 家在線'}</span><b>${esc(x.city)} ${esc(x.district)}</b><p>${x.total} 家進駐 · ${x.active} 家在線</p></button>`).join('')||'<p style="font-size:11px;color:#8A96A3">目前尚無獵場資料</p>';const mb=document.getElementById('mobile-districts');if(mb)mb.innerHTML=arr.slice(0,8).map(x=>`<button class="${x.knocks?'hot':''}" onclick="focusDistrict('${esc(x.city)}','${esc(x.district)}')">${esc(x.district||x.city)} · ${x.knocks?x.knocks+'敲碗':x.active+'在線'}</button>`).join('')}
function renderTicker(){const base=Array.isArray(payload.latestNews)?payload.latestNews:[],hot=(payload.allMerchants||[]).filter(m=>Number(m.knockToday)>0).sort((a,b)=>Number(b.knockToday)-Number(a.knockToday)).slice(0,5).map(m=>({text:`${m.name} 今天已有 ${m.knockToday} 位獵人在敲碗`,shopId:m.shopId})),live=(payload.allMerchants||[]).filter(m=>isActiveShop(m.shopId)).slice(0,5).map(m=>({text:`${m.name} 現在有獵物開賣中`,shopId:m.shopId})),news=[...hot,...live,...base].slice(0,10),shell=document.getElementById('radar-ticker'),track=document.getElementById('radar-ticker-track');if(!shell||!track||!news.length){if(shell)shell.classList.add('hidden');return}const one=news.map(n=>`<button type="button" class="radar-ticker-item" onclick="tickerOpen('${esc(n.shopId||'')}')">• <b>${esc(n.text||'獵場有新情報')}</b></button>`).join('');track.innerHTML=one+one;shell.classList.remove('hidden')}
function tickerOpen(shopId){if(!shopId)return;const m=(payload.allMerchants||[]).find(x=>String(x.shopId)===String(shopId));if(m){showMerchant(m);if(m.lat&&m.lng)map.setView([m.lat,m.lng],15)}}
function buildMap(){
  if(map)return;
  map=L.map('map',{zoomControl:true,preferCanvas:true,attributionControl:false}).setView([23.7,121],7);
  L.control.attribution({position:'topright',prefix:false}).addTo(map);
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap contributors',updateWhenIdle:true,keepBuffer:2}).addTo(map);
  setTimeout(()=>{navigator.geolocation?.getCurrentPosition(p=>{userPos=[p.coords.latitude,p.coords.longitude];drawUser(false)},()=>{}, {enableHighAccuracy:false,maximumAge:300000,timeout:3500})},250)
}
function renderMapData(fit=true){
  if(!map)buildMap();Object.keys(markers).forEach(id=>{try{markers[id].remove()}catch(_e){}});markers={};const pts=[];
  (payload.allMerchants||[]).forEach(mm=>{if(!mm.lat||!mm.lng)return;addMerchantMarker(mm);pts.push([mm.lat,mm.lng])});
  if(fit&&pts.length>1)map.fitBounds(pts,{padding:[35,35],maxZoom:11})
}
function addMerchantMarker(m){const active=isActiveShop(m.shopId),k=Number(m.knockToday)||0,hot=k>=3,watched=myWatchIds.has(String(m.shopId));const icon=L.divIcon({className:'',html:`<div class="shop-marker ${active?'active':'idle'} ${hot?'hot':''} ${watched?'watched':''}"><i data-lucide="${active?'utensils':'bell-ring'}" style="width:13px"></i>${k?`<span class="knock-badge">${k}</span>`:''}</div>`,iconSize:[30,30],iconAnchor:[15,15]});const mk=L.marker([m.lat,m.lng],{icon}).addTo(map).on('click',()=>showMerchant(m));markers[m.shopId]=mk;icons()}
function focusDistrict(city,district){const xs=(payload.allMerchants||[]).filter(m=>m.city===city&&m.district===district&&markers[m.shopId]).map(m=>markers[m.shopId]);if(xs.length)map.fitBounds(L.featureGroup(xs).getBounds().pad(.35))}
function drawUser(focus=true){if(!userPos)return;if(userMarker)userMarker.remove();userMarker=L.circleMarker(userPos,{radius:7,color:'#2563EB',weight:3,fillColor:'#60A5FA',fillOpacity:.9}).addTo(map).bindTooltip('你在這裡');if(focus)map.setView(userPos,14)}
function locateMe(){navigator.geolocation?.getCurrentPosition(p=>{userPos=[p.coords.latitude,p.coords.longitude];drawUser(true)},()=>toast('開啟定位後，就能快速回到附近獵場'),{enableHighAccuracy:true,maximumAge:30000,timeout:8000})}
function showMerchant(m){selected={type:'merchant',...m,watching:myWatchIds.has(String(m.shopId))};const active=isActiveShop(m.shopId),items=shopItems(m.shopId),remain=shopRemain(m.shopId),k=Number(m.knockToday)||0;document.getElementById('d-name').textContent=m.name||'獵場';document.getElementById('d-area').textContent=[m.city,m.district,m.address].filter(Boolean).join(' · ');document.getElementById('d-items').textContent=items;document.getElementById('d-remain').textContent=remain;document.getElementById('d-knock').textContent=k;document.getElementById('d-pills').innerHTML=`<span class="pill ${active?'live':''}">${active?'正在開賣':'暫無獵物'}</span>${m.isVip?'<span class="pill plus">Plus</span>':''}<span class="pill">${m.verified?'已實名':'驗證中'}</span>`;document.getElementById('d-demand').innerHTML=active?`<b>獵場目前有 ${items} 個獵物</b><p>直接查看商品，或分享給附近的朋友一起搶。</p>`:`<b>今天已有 ${k} 位獵人在敲碗</b><p>敲一下碗，讓老闆知道現在有人想吃；也可以開啟上架通知。</p>`;document.getElementById('d-actions').innerHTML=active?`<button class="btn ghost" onclick="focusSelected()">地圖查看</button><button class="btn primary" onclick="goHunt('${esc(m.shopId)}')">查看獵物</button>`:`<button class="btn ghost" onclick="focusSelected()">地圖查看</button><button class="btn primary" onclick="knock()">敲一下碗</button>`;document.getElementById('d-watch').style.display=active?'none':'flex';document.getElementById('d-watch-btn').classList.toggle('on',myWatchIds.has(String(m.shopId)));document.getElementById('drawer-bg').classList.remove('hidden');document.querySelector('.locate')?.classList.add('drawer-hidden');icons()}
function closeDrawer(){document.getElementById('drawer-bg').classList.add('hidden');document.querySelector('.locate')?.classList.remove('drawer-hidden')}
function focusSelected(){if(selected?.lat&&selected?.lng){map.setView([selected.lat,selected.lng],16);closeDrawer()}}
function goHunt(id){location.href=`index.html?targetShopId=${encodeURIComponent(id)}#home`}
async function knock(){if(uid==='LINE_GUEST'){toast('請先回首頁登入 LINE');return}const btn=document.querySelector('#d-actions .primary');if(btn){btn.disabled=true;btn.textContent='送出中…'}try{const j=await api('knockShop',{uid,shopId:selected.shopId,subscribe:'1'},18000);if(j.status==='success'){myWatchIds.add(String(selected.shopId));localStorage.setItem('sf_my_hunts_dirty',String(Date.now()));localStorage.setItem('sf_last_knocked_shop',String(selected.shopId));document.getElementById('d-watch-btn').classList.add('on');selected.knockToday=j.knockToday;const mm=(payload.allMerchants||[]).find(x=>String(x.shopId)===String(selected.shopId));if(mm)mm.knockToday=j.knockToday;document.getElementById('d-knock').textContent=j.knockToday;document.getElementById('d-demand').innerHTML=`<b>今天已有 ${j.knockToday} 位獵人在敲碗</b><p>${j.alreadyKnocked?'今天的敲碗已經記下來了。':'收到！這家店開賣時也會叫你。'}</p>`;renderSummary();renderDistricts();renderTicker();toast(j.alreadyKnocked?'今天已敲過這家':'敲碗成功，上架會叫你');refreshMarker(selected.shopId)}else if(j.status==='busy')toast('正在同步需求，請再按一次');else toast(j.msg||'目前無法送出敲碗')}catch(e){toast(e&&e.name==='AbortError'?'同步時間較久，請再按一次':'目前無法連線，請再試一次')}finally{if(btn){btn.disabled=false;btn.textContent='敲一下碗'}}}
async function toggleWatch(){if(uid==='LINE_GUEST'){toast('請先回首頁登入 LINE');return}const b=document.getElementById('d-watch-btn'),next=!b.classList.contains('on'),j=await api('setShopWatch',{uid,shopId:selected.shopId,active:next?'1':'0'});if(j.status==='success'){b.classList.toggle('on',next);if(next)myWatchIds.add(String(selected.shopId));else myWatchIds.delete(String(selected.shopId));localStorage.setItem('sf_my_hunts_dirty',String(Date.now()));refreshMarker(selected.shopId);toast(next?'已開啟：上架叫我':'已取消上架通知')}else toast(j.msg||'設定失敗')}
async function loadMyWatches(){if(uid==='LINE_GUEST')return;try{const j=await api('getMyHunts',{uid},10000);if(j.status==='success'){myWatchIds=new Set((j.hunts||[]).map(x=>String(x.shopId)));Object.keys(markers).forEach(id=>refreshMarker(id));if(selected?.shopId)document.getElementById('d-watch-btn')?.classList.toggle('on',myWatchIds.has(String(selected.shopId)))}}catch(e){}}
function refreshMarker(id){const m=(payload.allMerchants||[]).find(x=>x.shopId===id);if(!m||!markers[id])return;markers[id].remove();delete markers[id];addMerchantMarker(m)}
function clearSearch(){document.getElementById('place-search').value='';document.getElementById('search-results').classList.add('hidden')}
function localMatches(q){q=q.toLowerCase();return (payload.allMerchants||[]).filter(m=>(m.name+' '+m.address).toLowerCase().includes(q)).slice(0,6)}
async function doSearch(q){const box=document.getElementById('search-results');q=q.trim();if(q.length<2){box.classList.add('hidden');return}box.classList.remove('hidden');const local=localMatches(q),rows=[];local.forEach(m=>rows.push(`<button class="result" onclick="selectLocal('${esc(m.shopId)}')"><div><b>${esc(m.name)}</b><span>${esc(m.address||[m.city,m.district].filter(Boolean).join(' '))}</span></div><span class="tag">${isActiveShop(m.shopId)?'SEEFOOD · 開賣中':'SEEFOOD · 可敲碗'}</span></button>`));rows.push(`<button class="sf-google-search-cta" onclick="searchGooglePlacesNow('${esc(q)}',this)"><span>${local.length?'不是這些店？':'SEEFOOD 還沒有這間店'}<small>${local.length?'搜尋 Google 地點，找尚未加入 SEEFOOD 的店家':'到 Google 地點找找看，找到後可一鍵推薦新獵場'}</small></span><span class="go">${local.length?'搜尋其他店家':'搜尋 Google'}</span></button>`);box.innerHTML=rows.join('');icons()}
async function searchGooglePlacesNow(q,btn){if(!q||q.length<2)return;const box=document.getElementById('search-results');if(btn){btn.disabled=true;const g=btn.querySelector('.go');if(g)g.textContent='搜尋中…'}try{const j=await api('searchPlaceCandidates',{uid,q,lat:userPos?.[0]||'',lng:userPos?.[1]||''},12000);if(j.status==='success'){const local=localMatches(q),localIds=new Set(local.map(m=>String(m.name)+'|'+String(m.address))),external=(j.places||[]).filter(p=>!localIds.has(String(p.name)+'|'+String(p.address))),localRows=local.map(m=>`<button class="result" onclick="selectLocal('${esc(m.shopId)}')"><div><b>${esc(m.name)}</b><span>${esc(m.address||[m.city,m.district].filter(Boolean).join(' '))}</span></div><span class="tag">${isActiveShop(m.shopId)?'SEEFOOD · 開賣中':'SEEFOOD · 可敲碗'}</span></button>`),extRows=external.map(p=>`<button class="result external" onclick='recommendExternal(${JSON.stringify(p).replace(/'/g,"&#39;")})'><div><b>${esc(p.name)}</b><span>${esc(p.address)}</span></div><span class="tag">推薦新獵場</span></button>`);box.innerHTML=[...localRows,...extRows].join('')+(external.length?'':`<div class="search-state"><b>沒有找到更多店家</b>試試完整店名＋地區，例如「店名 高雄」。</div>`)}else if(j.status==='limited')box.innerHTML+=`<div class="search-state"><b>${esc(j.msg||'搜尋暫時受限')}</b>SEEFOOD 既有獵場仍可正常搜尋。</div>`;else box.innerHTML+=`<div class="search-state"><b>店家搜尋尚未連線</b>目前仍可搜尋 SEEFOOD 既有獵場；Google 店家搜尋完成設定後就會開放。</div>`}catch(e){box.innerHTML+=`<div class="search-state"><b>搜尋稍微忙碌</b>稍後再試一次。</div>`}finally{if(btn){btn.disabled=false;const g=btn.querySelector('.go');if(g)g.textContent='再搜尋一次'}icons()}}
function selectLocal(id){clearSearch();const m=(payload.allMerchants||[]).find(x=>String(x.shopId)===String(id));if(m){showMerchant(m);if(m.lat&&m.lng)map.setView([m.lat,m.lng],16)}}
async function recommendExternal(p){if(p&&p.lat&&p.lng)map.setView([Number(p.lat),Number(p.lng)],16);if(uid==='LINE_GUEST'){toast('請先回首頁登入 LINE，再推薦新獵場');return}const ok=confirm(`推薦「${p.name}」成為 SEEFOOD 新獵場？\n\n${p.address||''}`);if(!ok)return;try{const j=await api('recommendPlace',{uid,googlePlaceId:p.googlePlaceId||'',name:p.name||'',address:p.address||'',lat:p.lat||0,lng:p.lng||0,city:p.city||'',district:p.district||''},12000);if(j.status==='success'){toast(j.alreadyRecommended?'你已推薦過這間店':'推薦成功！這間店已加入獵場候選');document.getElementById('search-results').classList.add('hidden');document.getElementById('place-search').value=''}else toast(j.msg||'推薦失敗')}catch(e){toast('連線比較忙，請再試一次')}}
document.getElementById('place-search').addEventListener('input',e=>{clearTimeout(searchTimer);const q=e.target.value;searchTimer=setTimeout(()=>doSearch(q),220)});
load();icons();
</script></body></html>
